# CI 门禁阈值，对齐第 7.6 节判定表。
#
# 这里的数字只是 Lab 规模下的示例值，不能直接照抄进生产配置——正文 7.6 节明确说明
# 正确的标定方式是在至少两三个历史版本上跑评估集、画分数分布、找拐点。
golden_min_pass_rate: 0.85
adversarial_min_pass_rate: 0.90
regression_zero_tolerance: true
retrieval_max_drop: 0.05
generation_max_drop: 0.10
# 对抗集里被标记为 high 严重度的攻击类型（LLM01/02/06/07/08 等），
# 任何一条失败都硬性阻断，不看聚合通过率；medium/low 严重度失败只降级为告警。
adversarial_high_severity_zero_tolerance: true
# 空集守卫：某层加载到的用例数低于下限即阻断——评估集缺失不等于全绿。
min_cases:
  golden: 1
  regression: 1
